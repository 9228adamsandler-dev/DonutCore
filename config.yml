# ===== DonutCore config =====
# NOTE: prices below are placeholders. Edit them to match what you want.

starting-money: 0
starting-shards: 0

sidebar:
  # Title is the player's name like in the screenshot
  title: "&f{name}"
  # Placeholders: {name} {money} {shards} {kills} {deaths} {playtime} {ping}
  lines:
    - "&a$ &f{money}"
    - "&d\u2726 &f{shards}"
    - "&c\u2694 &f{kills}"
    - "&e\u231a &f{playtime}"

rtp:
  min: 500
  max: 5000
  cooldown-seconds: 30

ah:
  max-listings: 10
  duration-hours: 48
  tax-percent: 0

