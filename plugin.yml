name: DonutCore
main: com.donutclone.core.DonutCore
version: 1.0.0
api-version: '1.21'
description: Donut-style SMP core (money, shards, shop, sell, AH, RTP, sidebar, settings)
commands:
  balance:
    aliases: [bal, money]
    description: Show your balance
  shards:
    description: Show your shards
  pay:
    description: Pay another player
  shop:
    description: Open the shop
  sell:
    description: Open the sell menu
  ah:
    aliases: [auction, auctionhouse]
    description: Auction house
  rtp:
    aliases: [wild]
    description: Random teleport
  shardshop:
    aliases: [shardsshop]
    description: Open the shard shop
  settings:
    description: Open your settings
  msg:
    aliases: [m, w, tell, whisper]
    description: Private message
  r:
    aliases: [reply]
    description: Reply to last message
  eco:
    description: Admin economy command
    permission: donutcore.admin
permissions:
  donutcore.admin:
    default: op
